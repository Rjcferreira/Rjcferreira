<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Rjcferreira — SourceDump Store</title>
  <desc id="desc">Cabeçalho futurista azul, violeta e verde para o perfil GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060b"/><stop offset=".5" stop-color="#07131e"/><stop offset="1" stop-color="#03110f"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d8ff"/><stop offset=".5" stop-color="#7b61ff"/><stop offset="1" stop-color="#16e0a1"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#dfffff"/><stop offset=".25" stop-color="#23ddff"/><stop offset=".7" stop-color="#164a76"/><stop offset="1" stop-color="#030b13"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#24cdeb" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 290C220 240 330 342 570 284S920 210 1280 262V360H0Z" fill="#00d8ff" opacity=".04"/>
  <g transform="translate(86 48)" filter="url(#glow)">
    <circle cx="132" cy="132" r="118" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="15 9"/>
    <circle cx="132" cy="132" r="94" fill="url(#orb)" stroke="#88f5ff" stroke-width="4"/>
    <path d="M132 57 197 82v51c0 46-28 73-65 94-38-21-65-48-65-94V82Z" fill="#061720" fill-opacity=".5" stroke="#d8ffff" stroke-width="3"/>
    <text x="132" y="153" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="900" fill="#eaffff">SD</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="380" y="140" fill="#eefaff" font-size="63" font-weight="800" letter-spacing="3">RJCFERREIRA</text>
    <text x="382" y="205" fill="url(#neon)" font-size="35" font-weight="500" letter-spacing="11">SOURCEDUMP STORE</text>
    <rect x="384" y="236" width="650" height="2" fill="url(#neon)"/>
